<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5bd3" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="L'ordine delle interrogazioni della tua classe" />
    <title>WhosNext</title>
    <script>
      // Tema prima di disegnare la pagina (niente lampo bianco): stessa logica di src/lib/tema.ts
      try {
        var t = localStorage.getItem('tema')
        var scuro = t === 'scuro' || (t !== 'chiaro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.tema = scuro ? 'scuro' : 'chiaro'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
